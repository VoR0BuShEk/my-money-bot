<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Мой Финансовый Трекер</title>
    <style>
        :root { --bg-color: var(--tg-theme-bg-color, #ffffff); --text-color: var(--tg-theme-text-color, #000000); --hint-color: var(--tg-theme-hint-color, #999999); --button-color: var(--tg-theme-button-color, #2481cc); --button-text-color: var(--tg-theme-button-text-color, #ffffff); --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; padding-bottom: 80px; }
        h2 { margin-top: 0; font-size: 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background-color: var(--secondary-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: bold; font-size: 16px; }
        .card-subtitle { font-size: 14px; color: var(--hint-color); margin-top: 4px; }
        .card-amount { font-weight: bold; font-size: 18px; color: #e53935; }
        .goal-amount { color: #43a047; }
        .btn-delete { background: none; border: none; color: #ff5252; font-size: 18px; cursor: pointer; padding: 5px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--bg-color); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--secondary-bg); }
        .nav-item { text-align: center; font-size: 12px; color: var(--hint-color); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 33%; }
        .nav-item.active { color: var(--button-color); }
        .nav-icon { font-size: 20px; }
        .btn-add { background: var(--button-color); color: var(--button-text-color); border: none; padding: 10px; border-radius: 8px; font-size: 16px; width: 100%; margin-bottom: 16px; cursor: pointer; }
        #add-form { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); padding: 20px; z-index: 100; flex-direction: column; justify-content: center; }
        #add-form input, #add-form select { padding: 12px; margin-bottom: 12px; font-size: 16px; width: 100%; box-sizing: border-box; border: 1px solid var(--hint-color); border-radius: 8px; background: var(--secondary-bg); color: var(--text-color); }
        #add-form button { padding: 12px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; margin-bottom: 10px; width: 100%; }
        .btn-save { background: var(--button-color); color: var(--button-text-color); }
        .btn-cancel { background: #ff5252; color: white; }
    </style>
</head>

        <button class="btn-cancel" onclick="closeAddForm()">Отмена</button>
    </div>
