<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Мой Финансовый Трекер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--tg-theme-hint-color); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color);
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h2 id="greeting">Загрузка...</h2>
    
    <div class="card">
        <h3>Добавить новый долг</h3>
        
        <div class="form-group">
            <label>Название (кому или за что)</label>
            <input type="text" id="debtTitle" placeholder="Например: Другу Васе">
        </div>
        
        <div class="form-group">
            <label>Сумма (руб.)</label>
            <input type="number" id="debtAmount" placeholder="5000">
        </div>

        <div class="form-group">
            <label>Срок (ГГГГ-ММ-ДД)</label>
            <input type="date" id="debtDate">
        </div>

        <button onclick="saveDebt()">Сохранить долг</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
        }

        // Устанавливаем сегодняшнюю дату в календарь по умолчанию
        document.getElementById('debtDate').valueAsDate = new Date();

        function saveDebt() {
            const title = document.getElementById('debtTitle').value;
            const amount = document.getElementById('debtAmount').value;
            const date = document.getElementById('debtDate').value;

            // Простая проверка на пустые поля
            if (!title || !amount || !date) {
                tg.showAlert("Пожалуйста, заполните все поля!");
                return;
            }

            // Собираем данные в JSON
            const data = {
                action: "add_debt",
                title: title,
                amount: amount,
                date: date
            };

            // Отправляем боту
            tg.sendData(JSON.stringify(data));
            
            // Очищаем форму после отправки
            document.getElementById('debtTitle').value = '';
            document.getElementById('debtAmount').value = '';
        }
    </script>
</body>
</html>
