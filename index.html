<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Мой Финансовый Трекер</title>
    <style>
        :root { 
            --text: var(--tg-theme-text-color, #1c1c1e); 
            --hint: var(--tg-theme-hint-color, #8e8e93); 
            --btn: var(--tg-theme-button-color, #007aff); 
            --btn-text: var(--tg-theme-button-text-color, #ffffff); 
            --card-bg: rgba(255, 255, 255, 0.85); 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            color: var(--text); 
            margin: 0; 
            padding: 16px; 
            padding-bottom: 90px; 
            background: #f4f6fa; 
            min-height: 100vh;
        }

        h2 { 
            margin-top: 0; font-size: 28px; font-weight: 800;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .tab { display: none; } .tab.active { display: block; }

        /* Фон для Долгов (картинка с гирей) */
        #tab-debts {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('debts-bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            padding: 16px;
            padding-top: 60px; 
            padding-bottom: 90px; 
            overflow-y: auto;
        }

        #tab-goals {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; padding: 16px; padding-top: 60px; padding-bottom: 90px; overflow-y: auto;
        }

        #tab-savings {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; padding: 16px; padding-top: 60px; padding-bottom: 90px; overflow-y: auto;
        }

        #tab-stats {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; padding: 16px; padding-top: 60px; padding-bottom: 90px; overflow-y: auto;
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .card-title { font-weight: bold; font-size: 17px; color: #000; }
        .card-sub { font-size: 13px; color: #666; margin-top: 4px; }
        
        .amount { font-weight: 800; font-size: 18px; color: #ff3b30; }
        .amount-green { color: #34c759; }
        
        .btn-action { background: none; border: none; color: var(--btn); font-size: 15px; cursor: pointer; padding: 5px; font-weight: bold; }
        .btn-del { background: none; border: none; color: #ff3b30; font-size: 18px; cursor: pointer; padding: 5px; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            display: flex; justify-content: space-around; 
            padding: 12px 0 20px 0; 
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
        }
        
        .nav-item { text-align: center; font-size: 11px; color: #555; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 25%; transition: 0.2s; }
        .nav-item.active { color: var(--btn); font-weight: bold; }
        .nav-icon { font-size: 22px; }

        .btn-add { 
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; margin-bottom: 16px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        #form, #deposit-form, #pay-debt-form { 
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 20px; z-index: 100; flex-direction: column; justify-content: center; overflow-y: auto; 
        }
        
        #form h3, #deposit-form h3, #pay-debt-form h3 { text-align: center; font-size: 22px; margin-bottom: 20px; color: #000; }
        
        #form input, #deposit-form input, #pay-debt-form input { 
            padding: 14px; margin-bottom: 12px; font-size: 16px; width: 100%; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 12px; background: #fff; color: #000; 
        }
        
        #form button, #deposit-form button, #pay-debt-form button { 
            padding: 14px; font-size: 16px; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 10px; width: 100%; font-weight: bold;
        }
        .btn-save { background: var(--btn); color: var(--btn-text); }
        .btn-cancel { background: #ff3b30; color: white; }

        .progress-bg { background: rgba(0,0,0,0.1); height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; width: 100%; }
        .progress-bar { background: linear-gradient(90deg, #34c759, #28a745); height: 100%; border-radius: 5px; }

        .stat-box { 
            background: var(--card-bg); backdrop-filter: blur(12px);
            padding: 24px; border-radius: 16px; margin-bottom: 16px; text-align: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 6px solid var(--btn);
        }
        .stat-title { font-size: 15px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .stat-value { font-size: 32px; font-weight: 800; color: #000; }

        .date-btn { 
            padding: 14px; margin-bottom: 12px; font-size: 16px; width: 100%; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 12px; background: #fff; color: #000; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
        }
        
        #calendar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #calendar-box { background: #fff; color: #000; padding: 20px; border-radius: 20px; width: 90%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: bold; font-size: 18px; }
        .cal-header button { background: #f2f2f7; border: none; color: var(--btn); font-size: 20px; cursor: pointer; padding: 5px 15px; border-radius: 10px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-day-name { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: bold; }
        .cal-day { padding: 10px 0; border-radius: 10px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .cal-day:hover { background: #f2f2f7; }
        .cal-day.selected { background: var(--btn); color: white; font-weight: bold; }
        .cal-day.empty { cursor: default; }
        .cal-day.empty:hover { background: none; }
        .cal-close { width: 100%; padding: 14px; margin-top: 20px; background: #f2f2f7; border: none; border-radius: 12px; color: #ff3b30; font-size: 16px; font-weight: bold; cursor: pointer; }

        #greet {
            position: fixed; top: 0; left: 0; right: 0; padding: 16px; z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            margin: 0;
        }
    </style>
</head>
<body>
    <h2 id="greet">Мои деньги</h2>

    <!-- Вкладка Долги -->
    <div id="tab-debts" class="tab active">
        <button class="btn-add" onclick="showForm('debts')">➕ Добавить долг</button>
        <div id="list-debts"></div>
    </div>

    <!-- Вкладка Цели -->
    <div id="tab-goals" class="tab">
        <button class="btn-add" onclick="showForm('goals')">➕ Добавить цель</button>
        <div id="list-goals"></div>
    </div>

    <!-- Вкладка Сбережения -->
    <div id="tab-savings" class="tab">
        <button class="btn-add" onclick="showForm('savings')">➕ Добавить сбережение</button>
        <div id="list-savings"></div>
    </div>

    <!-- Вкладка Статистика -->
    <div id="tab-stats" class="tab">
        <div class="stat-box" style="border-left-color: #ff3b30;">
            <div class="stat-title">🔴 Общая сумма долгов</div>
            <div class="stat-value" id="stat-debts" style="color: #ff3b30;">0 ₽</div>
        </div>
        <div class="stat-box" style="border-left-color: #34c759;">
            <div class="stat-title">🎯 Накоплено на цели</div>
            <div class="stat-value" id="stat-goals" style="color: #34c759;">0 ₽</div>
        </div>
        <div class="stat-box" style="border-left-color: #007aff;">
            <div class="stat-title">🏦 Свободные сбережения</div>
            <div class="stat-value" id="stat-savings" style="color: #007aff;">0 ₽</div>
        </div>
    </div>

    <!-- Меню навигации -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('debts', this)"><div class="nav-icon">💳</div><div>Долги</div></div>
        <div class="nav-item" onclick="switchTab('goals', this)"><div class="nav-icon">🎯</div><div>Цели</div></div>
        <div class="nav-item" onclick="switchTab('savings', this)"><div class="nav-icon">🏦</div><div>Сбережения</div></div>
        <div class="nav-item" onclick="switchTab('stats', this)"><div class="nav-icon">📊</div><div>Статистика</div></div>
    </div>

    <!-- Модальное окно добавления -->
    <div id="form">
        <h3 id="form-title">Новая запись</h3>
        <input type="text" id="in-title" placeholder="Название">
        <input type="number" id="in-amount" placeholder="Сумма / Цель">
        <input type="number" id="in-saved" placeholder="Уже накоплено / выплачено" style="display:none;">
        
        <div class="date-btn" id="date-btn" onclick="openCalendar()">Срок: не выбран <span>📅</span></div>
        <input type="hidden" id="in-date" value="">

        <input type="hidden" id="in-type">
        <button class="btn-save" onclick="saveItem()">Сохранить</button>
        <button class="btn-cancel" onclick="hideForm()">Отмена</button>
    </div>

    <!-- Окно пополнения цели -->
    <div id="deposit-form">
        <h3>Пополнить цель</h3>
        <input type="number" id="dep-amount" placeholder="На какую сумму пополнить?">
        <button class="btn-save" onclick="depositGoal()">Пополнить</button>
        <button class="btn-cancel" onclick="document.getElementById('deposit-form').style.display = 'none'">Отмена</button>
    </div>

    <!-- Окно внесения платежа по долгу -->
    <div id="pay-debt-form">
        <h3>Внести платеж</h3>
        <input type="number" id="pay-debt-amount" placeholder="Сколько вы выплатили?">
        <button class="btn-save" onclick="payDebt()">Внести</button>
        <button class="btn-cancel" onclick="document.getElementById('pay-debt-form').style.display = 'none'">Отмена</button>
    </div>

    <!-- Календарь -->
    <div id="calendar-overlay">
        <div id="calendar-box">
            <div class="cal-header">
                <button onclick="changeMonth(-1)">‹</button>
                <span id="cal-month-year">Месяц Год</span>
                <button onclick="changeMonth(1)">›</button>
            </div>
            <div class="cal-grid" id="cal-days"></div>
            <button class="cal-close" onclick="closeCalendar()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const userId = tg.initDataUnsafe?.user?.id || 'guest';
        if (tg.initDataUnsafe?.user) {
            document.getElementById('greet').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }

        const STORAGE_KEY = 'myFinance_' + userId;
        // Добавляем поле "paid" (выплачено) для долгов
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { debts: [], goals: [], savings: [] };
        
        // Миграция данных: если у старых долгов нет поля "paid", добавляем его
        data.debts.forEach(d => { if(d.paid === undefined) d.paid = 0; });

        let currentGoalIndex = -1;
        let currentDebtIndex = -1;

        let currentDate = new Date();
        let selectedDate = null;

        function openCalendar() {
            document.getElementById('calendar-overlay').style.display = 'flex';
            renderCalendar();
        }

        function closeCalendar() {
            document.getElementById('calendar-overlay').style.display = 'none';
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('cal-month-year').innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            const daysContainer = document.getElementById('cal-days');
            daysContainer.innerHTML = '';

            ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(d => {
                daysContainer.innerHTML += `<div class="cal-day-name">${d}</div>`;
            });

            for (let i = 0; i < startOffset; i++) {
                daysContainer.innerHTML += `<div class="cal-day empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const isSelected = selectedDate && selectedDate.getDate() === i && selectedDate.getMonth() === month && selectedDate.getFullYear() === year;
                const cls = isSelected ? 'cal-day selected' : 'cal-day';
                daysContainer.innerHTML += `<div class="${cls}" onclick="selectDate(${year}, ${month}, ${i})">${i}</div>`;
            }
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            const dd = String(day).padStart(2, '0');
            const mm = String(month + 1).padStart(2, '0');
            const formatted = `${dd}.${mm}.${year}`;
            
            document.getElementById('in-date').value = formatted;
            document.getElementById('date-btn').innerHTML = `Срок: ${formatted} <span>📅</span>`;
            closeCalendar();
        }

        function render() {
            // Отрисовка ДОЛГОВ с прогресс-баром
            const lDebts = document.getElementById('list-debts');
            lDebts.innerHTML = data.debts.length ? '' : '<p style="text-align:center; color:#fff; margin-top:20px; text-shadow:0 1px 3px #000;">Нет долгов</p>';
            
            data.debts.forEach((item, i) => {
                const paid = item.paid || 0;
                const left = item.amount - paid;
                const percent = Math.min(Math.round((paid / item.amount) * 100), 100);
                
                // Если долг полностью выплачен, показываем поздравление
                if (left <= 0) {
                    lDebts.innerHTML += `<div class="card" style="opacity: 0.6; border-left: 6px solid #34c759;">
                        <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                            <div><div class="card-title" style="text-decoration: line-through;">${item.title}</div><div class="card-sub">Долг закрыт! 🎉</div></div>
                            <button class="btn-del" onclick="del('debts', ${i})">🗑</button>
                        </div>
                    </div>`;
                } else {
                    lDebts.innerHTML += `<div class="card" style="flex-direction: column; align-items: stretch;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div><div class="card-title">${item.title}</div><div class="card-sub">Срок: ${item.date || 'не указан'}</div></div>
                            <div style="text-align:right;">
                                <div class="amount">${left} ₽</div>
                                <div class="card-sub">из ${item.amount} ₽</div>
                            </div>
                        </div>
                        <div class="progress-bg"><div class="progress-bar" style="width: ${percent}%; background: #ff3b30;"></div></div>
                        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
                            <button class="btn-action" style="color: #ff3b30;" onclick="openPayDebt(${i})">➖ Внести платеж</button>
                            <button class="btn-del" onclick="del('debts', ${i})">🗑</button>
                        </div>
                    </div>`;
                }
            });

            // Отрисовка ЦЕЛЕЙ
            const lGoals = document.getElementById('list-goals');
            lGoals.innerHTML = data.goals.length ? '' : '<p style="text-align:center; color:#555; margin-top:20px;">Нет целей</p>';
            data.goals.forEach((item, i) => {
                const saved = item.saved || 0;
                const percent = Math.min(Math.round((saved / item.amount) * 100), 100);
                lGoals.innerHTML += `<div class="card" style="flex-direction: column; align-items: stretch;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div><div class="card-title">${item.title}</div><div class="card-sub">Цель: ${item.amount} ₽<br>Срок: ${item.date || 'не указан'}</div></div>
                        <div style="text-align:right;">
                            <div class="amount amount-green" style="font-size: 18px;">${saved} ₽</div>
                            <div class="card-sub">${percent}%</div>
                        </div>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" style="width: ${percent}%;"></div></div>
                    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
                        <button class="btn-action" onclick="openDeposit(${i})">➕ Пополнить</button>
                        <button class="btn-del" onclick="del('goals', ${i})">🗑</button>
                    </div>
                </div>`;
            });

            // Отрисовка СБЕРЕЖЕНИЙ
            const lSavings = document.getElementById('list-savings');
            lSavings.innerHTML = data.savings.length ? '' : '<p style="text-align:center; color:#555; margin-top:20px;">Нет сбережений</p>';
            data.savings.forEach((item, i) => {
                lSavings.innerHTML += `<div class="card"><div><div class="card-title">${item.title}</div><div class="card-sub">Сбережение</div></div>
                    <div style="display:flex; gap:10px; align-items:center;"><div class="amount amount-green">+ ${item.amount} ₽</div>
                    <button class="btn-del" onclick="del('savings', ${i})">🗑</button></div></div>`;
            });

            // СТАТИСТИКА (считаем только ОСТАВШУЮСЯ сумму долгов)
            const totalDebts = data.debts.reduce((sum, item) => {
                const left = item.amount - (item.paid || 0);
                return sum + (left > 0 ? left : 0);
            }, 0);
            
            const totalSaved = data.goals.reduce((sum, item) => sum + (item.saved || 0), 0);
            const totalSavings = data.savings.reduce((sum, item) => sum + item.amount, 0);

            document.getElementById('stat-debts').innerText = `${totalDebts} ₽`;
            document.getElementById('stat-goals').innerText = `${totalSaved} ₽`;
            document.getElementById('stat-savings').innerText = `${totalSavings} ₽`;
        }

        function switchTab(id, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            el.classList.add('active');
        }

        function showForm(type) {
            document.getElementById('in-type').value = type;
            document.getElementById('form-title').innerText = type === 'debts' ? 'Новый долг' : (type === 'goals' ? 'Новая цель' : 'Новое сбережение');
            
            // Показываем поле "уже выплачено/накоплено" и для долгов, и для целей
            document.getElementById('in-saved').style.display = (type === 'goals' || type === 'debts') ? 'block' : 'none';
            document.getElementById('in-saved').placeholder = type === 'debts' ? 'Уже выплачено (если есть)' : 'Уже накоплено';
            
            document.getElementById('date-btn').style.display = type === 'savings' ? 'none' : 'flex';
            
            selectedDate = new Date();
            const dd = String(selectedDate.getDate()).padStart(2, '0');
            const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const yyyy = selectedDate.getFullYear();
            const formatted = `${dd}.${mm}.${yyyy}`;
            
            document.getElementById('in-date').value = formatted;
            document.getElementById('date-btn').innerHTML = `Срок: ${formatted} <span>📅</span>`;

            document.getElementById('form').style.display = 'flex';
        }

        function hideForm() { 
            document.getElementById('form').style.display = 'none'; 
            document.getElementById('in-title').value = '';
            document.getElementById('in-amount').value = '';
            document.getElementById('in-saved').value = '';
        }

        function saveItem() {
            const type = document.getElementById('in-type').value;
            const title = document.getElementById('in-title').value;
            const amount = parseFloat(document.getElementById('in-amount').value);
            const initial = parseFloat(document.getElementById('in-saved').value || 0);
            const date = document.getElementById('in-date').value;

            if (!title || isNaN(amount)) { tg.showAlert("Заполните поля!"); return; }

            if (type === 'debts') {
                data.debts.push({ title: title, amount: amount, paid: initial, date: date });
            } else if (type === 'goals') {
                data.goals.push({ title: title, amount: amount, saved: initial, date: date });
            } else {
                data.savings.push({ title: title, amount: amount, date: date });
            }
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
            hideForm();
        }

        // --- ЛОГИКА ЦЕЛЕЙ ---
        function openDeposit(index) {
            currentGoalIndex = index;
            document.getElementById('dep-amount').value = '';
            document.getElementById('deposit-form').style.display = 'flex';
        }

        function depositGoal() {
            const amount = parseFloat(document.getElementById('dep-amount').value);
            if (isNaN(amount) || amount <= 0) { tg.showAlert("Введите корректную сумму"); return; }
            
            data.goals[currentGoalIndex].saved = (data.goals[currentGoalIndex].saved || 0) + amount;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
            document.getElementById('deposit-form').style.display = 'none';
        }

        // --- ЛОГИКА ДОЛГОВ ---
        function openPayDebt(index) {
            currentDebtIndex = index;
            document.getElementById('pay-debt-amount').value = '';
            document.getElementById('pay-debt-form').style.display = 'flex';
        }

        function payDebt() {
            const amount = parseFloat(document.getElementById('pay-debt-amount').value);
            if (isNaN(amount) || amount <= 0) { tg.showAlert("Введите корректную сумму"); return; }
            
            data.debts[currentDebtIndex].paid = (data.debts[currentDebtIndex].paid || 0) + amount;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
            document.getElementById('pay-debt-form').style.display = 'none';
        }

        function del(type, index) {
            if (confirm("Удалить запись?")) {
                data[type].splice(index, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                render();
            }
        }

        render();
    </script>
</body>
</html>
